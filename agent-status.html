<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'">
<title>BridgeUX quick controls</title>
<link rel="stylesheet" href="agent-status.css">
</head>
<body>
<main class="panel" aria-label="BridgeUX quick controls">
  <header class="topbar">
    <span class="brand-mark" aria-hidden="true">B</span>
    <div class="brand-copy"><strong>BridgeUX</strong><span>ACCESSIBILITY COMPANION</span></div>
    <span id="statePill" class="state-pill"><i></i><span id="stateLabel">Ready</span></span>
    <button id="hide" class="icon-button" type="button" aria-label="Hide quick controls" title="Hide">×</button>
  </header>
  <section class="status-card" aria-live="polite">
    <span id="statusIcon" class="status-icon" aria-hidden="true">◉</span>
    <div class="status-copy"><strong id="message">BridgeUX is ready</strong><span id="transcript">Use voice or ask about the screen without opening the main window.</span></div>
  </section>
  <section class="action-grid" aria-label="Quick actions">
    <button id="listen" class="action primary" type="button"><span class="action-icon" aria-hidden="true">◖</span><span id="listenLabel">Start listening</span></button>
    <button id="screen" class="action" type="button"><span class="action-icon" aria-hidden="true">◎</span><span>Explain my screen</span></button>
    <button id="captions" class="action" type="button"><span class="action-icon" aria-hidden="true">CC</span><span id="captionsLabel">Live captions</span></button>
    <button id="openApp" class="action" type="button"><span class="action-icon" aria-hidden="true">↗</span><span>Open BridgeUX</span></button>
  </section>
  <form id="quickAsk" class="ask-row">
    <label class="sr-only" for="prompt">Ask BridgeUX</label>
    <input id="prompt" maxlength="800" placeholder="Ask BridgeUX anything…" autocomplete="off">
    <button type="submit" aria-label="Ask BridgeUX">Ask</button>
  </form>
  <footer><span id="privacy">Your audio and screen stay on this device.</span><button id="stopAll" type="button">Stop</button></footer>
</main>
<script src="system-captions.js"></script>
<script src="agent-status.js"></script>
</body>
</html>
