<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BridgeUX live captions</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;background:transparent;color:#fff;font:600 18px/1.3 "Segoe UI",Arial,sans-serif}.frame{height:100%;display:flex;align-items:center;justify-content:center;padding:3px 12px}.caption{width:100%;max-height:100%;overflow:hidden;padding:8px 18px;border:1px solid #d7fff044;border-left:3px solid #55d2b4;border-radius:13px;background:linear-gradient(140deg,#17242de8,#101820e8);box-shadow:0 8px 22px #0006,inset 0 1px #ffffff18;text-align:center;backdrop-filter:blur(10px)}.text{display:-webkit-box;max-height:2.6em;margin:0;text-wrap:balance;overflow:hidden;overflow-wrap:anywhere;font-size:18px;line-height:1.3;font-weight:650;text-shadow:0 1px 2px #0008;-webkit-line-clamp:2;-webkit-box-orient:vertical}
</style>
</head>
<body><main class="frame"><section class="caption" aria-live="polite"><p id="caption" class="text"></p></section></main><script src="caption-overlay.js"></script></body>
</html>
