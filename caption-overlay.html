<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BridgeUX live captions</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;background:transparent;color:#fff;font:600 27px/1.35 "Segoe UI",Arial,sans-serif}.frame{height:100%;display:flex;align-items:center;justify-content:center;padding:5px 18px}.caption{width:100%;max-height:100%;overflow:hidden;padding:13px 23px;border:1px solid #ffffff55;border-radius:16px;background:#101820ed;box-shadow:0 12px 36px #0008;text-align:center;backdrop-filter:blur(14px)}.brand{margin-bottom:2px;color:#b7dcd1;font-size:11px;letter-spacing:.15em;font-weight:750}.text{margin:0;text-wrap:balance;overflow-wrap:anywhere;font-size:27px;line-height:1.32;font-weight:650}
</style>
</head>
<body><main class="frame"><section class="caption" aria-live="polite"><div class="brand">BRIDGEUX · LIVE CAPTIONS</div><p id="caption" class="text">Listening to computer audio…</p></section></main><script src="caption-overlay.js"></script></body>
</html>
